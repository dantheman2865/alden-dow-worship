<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alden B. Dow Houses of Worship</title>
    <meta
      name="description"
      content="An interactive bucket-list map of the religious buildings designed by architect Alden B. Dow."
    />

    <!-- Leaflet (OpenStreetMap) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="title-block">
        <h1>Alden B. Dow Houses of Worship</h1>
        <p class="subtitle">A bucket-list map of the architect's religious buildings</p>
      </div>

      <div class="header-controls">
        <div class="progress" id="progress" aria-live="polite">0 / 0 visited</div>
        <input
          type="search"
          id="search"
          class="search"
          placeholder="Search name, city, year…"
          aria-label="Search buildings"
        />
        <div class="filters" role="group" aria-label="Filter buildings">
          <button class="filter-btn is-active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="visited">Visited</button>
          <button class="filter-btn" data-filter="unvisited">Not visited</button>
        </div>
        <label class="edit-toggle">
          <input type="checkbox" id="edit-mode" />
          <span>Edit mode</span>
        </label>
      </div>
    </header>

    <!-- Publish bar (only shown in edit mode) -->
    <div class="publish-bar" id="publish-bar" hidden>
      <span class="publish-status" id="publish-status"></span>
      <div class="publish-actions">
        <button id="btn-save-folder" class="btn">Save to repo folder</button>
        <button id="btn-zip" class="btn">Download publish zip</button>
        <button id="btn-export" class="btn btn-ghost">Backup JSON</button>
        <button id="btn-clear" class="btn btn-ghost">Clear local edits</button>
      </div>
    </div>

    <main class="layout">
      <div id="map" class="map"></div>
      <aside class="list-panel">
        <ul id="list" class="list"></ul>
      </aside>
    </main>

    <!-- Detail drawer -->
    <div class="drawer-overlay" id="drawer-overlay" hidden></div>
    <section class="drawer" id="drawer" hidden aria-label="Building details">
      <button class="drawer-close" id="drawer-close" aria-label="Close">&times;</button>
      <div id="drawer-content"></div>
    </section>

    <!-- Lightbox for viewing photos -->
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" aria-label="Close">&times;</button>
      <button class="lightbox-nav lightbox-prev" aria-label="Previous photo">&#8249;</button>
      <button class="lightbox-nav lightbox-next" aria-label="Next photo">&#8250;</button>
      <div class="lightbox-stage">
        <div class="lightbox-spinner" id="lightbox-spinner" hidden></div>
        <img id="lightbox-img" alt="" />
      </div>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
